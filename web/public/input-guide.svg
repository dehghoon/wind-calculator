<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" role="img" aria-labelledby="t d"><title id="t">Wind inputs: geometry and pressure directions</title><desc id="d">Wind approaches a pitched roof building. Height H is vertical. D is parallel to wind. B and W are plan dimensions. Positive pressure acts inward and suction outward. Surface numbers must be taken from the selected code load-case figure.</desc><rect width="760" height="390" fill="#f8fbfd"/><g stroke="#315d7c" stroke-width="2" fill="none"><path d="M210 300V180L330 115L450 180V300Z" fill="#e0eef7"/><path d="M450 180L615 125L495 60L330 115M450 300L615 245V125M210 180L375 125"/><path d="M330 115V250" stroke-dasharray="6 5"/><path d="M125 300V180M118 180H132M118 300H132M220 325H440M220 318V332M440 318V332M470 320L630 263"/><path d="M45 225H180L164 216M180 225L164 234" stroke="#1565c0" stroke-width="5"/><path d="M550 90L580 54M580 54L565 61M580 54L578 70" stroke="#0f8f83" stroke-width="4"/></g><g fill="#15385a" font-family="Arial,sans-serif" font-size="18"><text x="90" y="245">H</text><text x="310" y="350">B</text><text x="575" y="320">D ∥ wind</text><text x="45" y="200">Wind →</text><text x="240" y="245">+ inward</text><text x="590" y="54">− suction</text><text x="380" y="90">Roof slope α</text><text x="30" y="375" font-size="14">Geometry schematic · use the code figure for numbered surfaces, edge zones and load cases A/B.</text></g></svg>